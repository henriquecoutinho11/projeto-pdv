<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antunes Lanches - Painel de Senhas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/painel-senhas.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
</head>
<body class="tv-body">

    <!-- Cabeçalho da TV -->
    <header class="tv-header">
        <div class="tv-brand">
            <img th:src="@{/img/logo.svg}" alt="Logo Antunes Lanches" class="tv-logo">
            <div>
                <h1 class="tv-title">ANTUNES <span>LANCHES</span></h1>
                <p class="tv-subtitle">Acompanhe o status do seu pedido</p>
            </div>
        </div>

        <div class="tv-controls">
            <div class="tv-status-pill" id="tv-sync-status">
                <span class="tv-dot"></span>
                <span class="tv-sync-text">Ao Vivo</span>
            </div>

            <button type="button" class="tv-ctrl-btn" id="btn-tv-sound" title="Ativar/Desativar som de chamada (Ding-dong)" aria-label="Alternar som">
                <svg id="tv-icon-sound-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="tv-icon-sound-off" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                <span id="tv-sound-label">Som Ativo</span>
            </button>

            <button type="button" class="tv-ctrl-btn" id="btn-tv-fullscreen" title="Modo Tela Cheia para TV" aria-label="Tela cheia">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span>Tela Cheia</span>
            </button>
        </div>
    </header>

    <!-- Painel Principal em Duas Colunas -->
    <main class="tv-main">
        <!-- Coluna 1: Em Preparo -->
        <section class="tv-column tv-col-preparo" aria-label="Pedidos em preparo">
            <div class="tv-col-header">
                <span class="tv-col-icon">⏳</span>
                <h2>EM PREPARO</h2>
                <span class="tv-col-badge" id="tv-count-preparo">0</span>
            </div>
            <div class="tv-grid-preparo" id="tv-list-preparo" aria-live="polite">
                <!-- Senhas em preparo renderizadas via JS -->
            </div>
            <div class="tv-empty hidden" id="tv-empty-preparo">
                Nenhum pedido em preparo no momento.
            </div>
        </section>

        <!-- Coluna 2: Pronto Para Retirada -->
        <section class="tv-column tv-col-pronto" aria-label="Pedidos prontos para retirada">
            <div class="tv-col-header">
                <span class="tv-col-icon">🔔</span>
                <h2>PRONTO PARA RETIRADA</h2>
                <span class="tv-col-badge" id="tv-count-pronto">0</span>
            </div>

            <!-- Destaque da última senha chamada -->
            <div class="tv-chamada-destaque hidden" id="tv-chamada-destaque" aria-live="assertive">
                <span class="tv-destaque-label">RETIRAR NO BALCÃO</span>
                <div class="tv-destaque-senha" id="tv-destaque-senha">#000</div>
                <div class="tv-destaque-cliente" id="tv-destaque-cliente"></div>
            </div>

            <div class="tv-grid-pronto" id="tv-list-pronto" aria-live="polite">
                <!-- Senhas prontas renderizadas via JS -->
            </div>
            <div class="tv-empty hidden" id="tv-empty-pronto">
                Aguardando pedidos ficarem prontos.
            </div>
        </section>
    </main>

    <!-- Rodapé com Relógio Digital e Data -->
    <footer class="tv-footer">
        <div class="tv-footer-brand">
            <span>Antunes Lanches &bull; Retire seu pedido quando sua senha aparecer em verde</span>
        </div>
        <div class="tv-datetime">
            <span class="tv-date" id="tv-date">--/--/----</span>
            <span class="tv-clock" id="tv-clock">--:--:--</span>
        </div>
    </footer>

    <script th:src="@{/js/painel-senhas.js}"></script>
</body>
</html>
