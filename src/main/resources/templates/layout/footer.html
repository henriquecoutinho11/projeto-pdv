<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Fragmento do Rodapé do Totem -->
    <footer th:fragment="totem-footer" class="totem-footer">
        <div class="footer-btn-group">
            <button type="button" class="btn btn-outline" id="btn-help" aria-label="Pedir ajuda ao atendente">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                Precisa de Ajuda?
            </button>

            <button type="button" class="btn btn-outline" id="btn-restart" aria-label="Recomeçar atendimento" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                Recomeçar
            </button>
        </div>

        <div class="footer-info">
            <span>Antunes Lanches &bull; Sistema PDV Web Core v1.0</span>
        </div>
    </footer>
</body>
</html>
