<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="shakeShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <g filter="url(#shakeShadow)">
    <!-- Taça / Copo de Vidro -->
    <path d="M 110 90 L 130 230 C 130 250, 190 250, 190 230 L 210 90 Z" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- Conteúdo Chocolate Cremoso -->
    <path d="M 115 100 L 132 225 C 135 240, 185 240, 188 225 L 205 100 Z" fill="#5D4037" />
    <!-- Calda de Chocolate Escorrendo -->
    <path d="M 118 100 Q 130 140 140 115 Q 155 160 170 120 Q 185 150 202 100" fill="#3E2723" />
    <!-- Chantilly Espesso Superior -->
    <ellipse cx="160" cy="90" rx="55" ry="20" fill="#FFF8E1" />
    <ellipse cx="160" cy="75" rx="42" ry="18" fill="#FFFFFF" />
    <ellipse cx="160" cy="60" rx="28" ry="15" fill="#FFF9C4" />
    <!-- Cereja no Topo -->
    <circle cx="160" cy="45" r="14" fill="#C62828" />
    <path d="M 160 40 Q 175 15 190 25" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Canudo Espiral Retrô -->
    <line x1="180" y1="75" x2="225" y2="15" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
