<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D32F2F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    <filter id="burgerGlow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#bgGlow)" />
  <!-- Pão Superior Brioche -->
  <g filter="url(#burgerGlow)">
    <path d="M 50 115 C 50 45, 270 45, 270 115 Z" fill="url(#bunGrad)" stroke="#FFA000" stroke-width="2" />
    <!-- Gergelim -->
    <ellipse cx="100" cy="80" rx="4" ry="2" fill="#FFF9C4" transform="rotate(-15 100 80)" />
    <ellipse cx="140" cy="65" rx="4" ry="2" fill="#FFF9C4" transform="rotate(10 140 65)" />
    <ellipse cx="180" cy="68" rx="4" ry="2" fill="#FFF9C4" transform="rotate(-5 180 68)" />
    <ellipse cx="220" cy="85" rx="4" ry="2" fill="#FFF9C4" transform="rotate(20 220 85)" />
    <ellipse cx="160" cy="95" rx="4" ry="2" fill="#FFF9C4" />
    <!-- Molho Especial e Picles -->
    <path d="M 65 115 Q 160 125 255 115" stroke="#D32F2F" stroke-width="6" stroke-linecap="round" />
    <!-- Queijo Cheddar Derretido 1 -->
    <polygon points="50,120 270,120 240,150 190,135 150,158 110,135 75,148" fill="#FFC107" />
    <!-- Hambúrguer 1 (Smash) -->
    <rect x="45" y="130" width="230" height="26" rx="13" fill="url(#pattyGrad)" />
    <!-- Fatias de Bacon Crocante -->
    <path d="M 55 156 Q 90 148 130 156 Q 180 164 220 154 Q 250 148 265 156" stroke="#8D6E63" stroke-width="8" stroke-linecap="round" />
    <path d="M 60 156 Q 90 148 130 156 Q 180 164 220 154 Q 250 148 260 156" stroke="#C2185B" stroke-width="4" stroke-linecap="round" />
    <!-- Queijo Cheddar 2 -->
    <polygon points="50,165 270,165 250,185 200,175 160,195 120,178 80,190" fill="#FFB300" />
    <!-- Hambúrguer 2 (Smash) -->
    <rect x="45" y="175" width="230" height="26" rx="13" fill="url(#pattyGrad)" />
    <!-- Alface Americana Crocante -->
    <path d="M 45 206 C 70 216, 90 198, 120 212 C 150 222, 175 200, 205 214 C 235 224, 255 204, 275 210" fill="none" stroke="#4CAF50" stroke-width="12" stroke-linecap="round" />
    <path d="M 48 206 C 70 214, 90 200, 120 210 C 150 218, 175 202, 205 212 C 235 220, 255 206, 272 210" fill="none" stroke="#81C784" stroke-width="5" stroke-linecap="round" />
    <!-- Pão Inferior Brioche -->
    <path d="M 55 218 C 55 245, 265 245, 265 218 Z" fill="url(#bunGrad)" stroke="#FFA000" stroke-width="2" />
  </g>
</svg>
