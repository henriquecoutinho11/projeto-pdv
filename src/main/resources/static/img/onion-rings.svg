<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D32F2F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="ringShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="160" cy="160" r="140" fill="url(#ringGlow)" />

  <g filter="url(#ringShadow)">
    <!-- Anel 1 (Traseiro Esquerdo) -->
    <ellipse cx="110" cy="150" rx="65" ry="42" fill="none" stroke="url(#crustGrad)" stroke-width="26" transform="rotate(-25 110 150)" />
    <!-- Anel 2 (Traseiro Direito) -->
    <ellipse cx="205" cy="140" rx="68" ry="44" fill="none" stroke="url(#crustGrad)" stroke-width="26" transform="rotate(20 205 140)" />
    <!-- Anel 3 (Frontal Central Inclinado) -->
    <ellipse cx="160" cy="195" rx="75" ry="48" fill="none" stroke="url(#crustGrad)" stroke-width="28" transform="rotate(-5 160 195)" />

    <!-- Textura de Empanado Crocante -->
    <circle cx="140" cy="180" r="3" fill="#FFF9C4" />
    <circle cx="185" cy="190" r="3.5" fill="#FFF9C4" />
    <circle cx="165" cy="215" r="2.5" fill="#FFF9C4" />
    <circle cx="115" cy="140" r="3" fill="#FFF9C4" />
    <circle cx="210" cy="135" r="3" fill="#FFF9C4" />
  </g>
</svg>
