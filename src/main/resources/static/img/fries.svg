<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="friesGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D32F2F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fryGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="60%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="fryGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58" />
      <stop offset="50%" stop-color="#FDD835" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="fryShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <circle cx="160" cy="160" r="140" fill="url(#friesGlow)" />

  <g filter="url(#fryShadow)">
    <!-- Palitos de Batata (Camada Traseira) -->
    <rect x="95" y="55" width="18" height="130" rx="6" fill="url(#fryGrad2)" transform="rotate(-18 95 120)" />
    <rect x="130" y="40" width="18" height="145" rx="6" fill="url(#fryGrad1)" transform="rotate(-6 130 110)" />
    <rect x="165" y="35" width="20" height="150" rx="6" fill="url(#fryGrad1)" transform="rotate(5 165 110)" />
    <rect x="200" y="48" width="18" height="135" rx="6" fill="url(#fryGrad2)" transform="rotate(16 200 115)" />

    <!-- Palitos Dianteiros -->
    <rect x="115" y="60" width="19" height="120" rx="6" fill="url(#fryGrad1)" transform="rotate(-10 115 120)" />
    <rect x="150" y="50" width="20" height="130" rx="6" fill="url(#fryGrad2)" transform="rotate(1 150 115)" />
    <rect x="185" y="58" width="19" height="125" rx="6" fill="url(#fryGrad1)" transform="rotate(12 185 120)" />

    <!-- Caixinha Vermelha Antunes Lanches -->
    <path d="M 75 145 L 90 270 Q 160 285 230 270 L 245 145 Q 160 180 75 145 Z" fill="url(#boxGrad)" stroke="#FFCDD2" stroke-width="1.5" />
    
    <!-- Emblema / Logo da Caixinha -->
    <circle cx="160" cy="220" r="30" fill="#FFC107" />
    <text x="160" y="228" font-family="'Poppins', sans-serif" font-weight="900" font-size="24" fill="#D32F2F" text-anchor="middle">A</text>
  </g>
</svg>
